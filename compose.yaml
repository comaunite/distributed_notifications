services:
  notificationorchestrator:
    image: notificationorchestrator
    build:
      context: .
      dockerfile: NotificationOrchestrator/Dockerfile

  notificationworkeremail:
    image: notificationworker
    build:
      context: .
      dockerfile: NotificationWorker.Email/Dockerfile

  notificationworkersms:
    image: notificationworker
    build:
      context: .
      dockerfile: NotificationWorker.SMS/Dockerfile

  notificationworkerinapp:
    image: notificationworker
    build:
      context: .
      dockerfile: NotificationWorker.InApp/Dockerfile

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres:
    image: postgres:latest
    container_name: notification-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: NotificationDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d NotificationDb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: notification-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: